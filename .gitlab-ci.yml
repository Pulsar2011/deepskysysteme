# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#priority-of-environment-variables
image:
  name: gitlab-registry.in2p3.fr/in2p3_euclid/gacen/dbbuilder_test:v1

stages:
- .pre
- build
- test
- deploy

variables:
  GIT_SUBMODULE_STRATEGY: normal

deps:
  stage: .pre
  script:
  - SRC_DIR=`pwd`
  - echo ${SRC_DIR} 
  - DEPS_DIR="${SRC_DIR}/deps"
  - mkdir -p deps && cd deps
  # we use wget to fetch the cmake binaries
  - aptget --no-check-certificate https://github.com/Kitware/CMake/releases/download/v3.23.2/cmake-3.23.2-linux-x86_64.tar.gz
  - aptget --no-check-certificate https://github.com/Kitware/CMake/releases/download/v3.23.2/cmake-3.23.2-SHA-256.txt
  - sha256sum -c cmake-3.23.2-SHA-256.txt
  - tar -xvf cmake-3.23.2-linux-x86_64.tar.gz > /dev/null
  - mv cmake-3.23.2-linux-x86_64 cmake-install
  - PATH=${DEPS_DIR}/cmake-install:${DEPS_DIR}/cmake-install/bin:$PATH
  - cd ${SRC_DIR}


build:
  stage: build
  script:
  - mkdir build
  - cd build
  - cmake -Wno-dev ..
  - make -j $(nproc --all)
  artifacts:
    expire_in: 2 hrs
    paths:
    - build

test:
  stage: test
  script:
  - cd build
  - make test

pages:
  stage: deploy
  script:
  - cd build
  - cmake ..
  - make doc
  - cd ..
  - mv build/doc/html public
  artifacts:
    paths:
    - public
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
